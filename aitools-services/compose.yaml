name: aitools-services

services:
  aitools-litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    container_name: aitools-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@aitools-pg:5432/litellm
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      REDIS_URL: redis://aitools-redis:6379
      CHATGPT_TOKEN_DIR: /root/.codex/chatgpt
      CHATGPT_AUTH_FILE: auth.json
      # LiteLLM injects the full codex system prompt by default - this clears it out.
      # OpenAI might start rejecting requests that don't include the preamble since it's easy to detect the spoofed request without it.
      # Hermes does not include the preamble in its native codex subscription support.
      # For now, match hermes native behavior to avoid unexpected behavior when using the LiteLLM ChatGPT models with hermes.
      # Must be set to at least a single space - empty values are stripped and LiteLLM with fallback to default injection.
      CHATGPT_DEFAULT_INSTRUCTIONS: " "
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      # Bind mount for chatgpt oauth subscriptions auth
      - ./litellm/chatgpt:/root/.codex/chatgpt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 18
    networks: [aitools-net]

  aitools-honcho-api:
    build: { context: ./honcho-src, dockerfile: Dockerfile }
    container_name: aitools-honcho-api
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD}@aitools-pg:5432/honcho
      CACHE_URL: redis://aitools-redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      HONCHO_VIRTUAL_KEY: ${HONCHO_VIRTUAL_KEY}
    volumes:
      - ./honcho/config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 30
    networks: [aitools-net]

  aitools-honcho-deriver:
    build: { context: ./honcho-src, dockerfile: Dockerfile }
    container_name: aitools-honcho-deriver
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD}@aitools-pg:5432/honcho
      CACHE_URL: redis://aitools-redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      HONCHO_VIRTUAL_KEY: ${HONCHO_VIRTUAL_KEY}
    volumes:
      - ./honcho/config.toml:/app/config.toml:ro
    networks: [aitools-net]

networks:
  aitools-net:
    external: true
