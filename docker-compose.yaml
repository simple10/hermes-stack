# Unified compose. Run via `just` (sets COMPOSE_ENV_FILES + project name).
# NO top-level `name:` — the project name comes from COMPOSE_PROJECT_NAME in
# .stack/.env (default `aitools`), so multiple independent stacks can run
# side by side. Each stack's services/volumes/network are project-scoped;
# OrbStack exposes services at <service>.<project>.orb.local
# (e.g. litellm.aitools.orb.local). Containers use Compose's default
# per-project network — no shared external network.

include:
  - services/pg/compose.yaml
  - services/redis/compose.yaml
  - services/rabbitmq/compose.yaml
  - services/litellm/compose.yaml
  - services/honcho/compose.yaml
  - services/honcho-ui/compose.yaml
  - services/agentmemory/compose.yaml
  - services/hindsight/compose.yaml
  - services/cliproxyapi/compose.yaml
  - services/firecrawl/compose.yaml
  - services/camofox-browser/compose.yaml
  - services/browser-use/compose.yaml
  - services/localhost-proxy/compose.yaml
  - services/searxng/compose.yaml
