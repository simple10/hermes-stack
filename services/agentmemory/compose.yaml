# agentmemory (rohitg00/agentmemory) — persistent memory server for AI agents.
# profile [agentmemory]. Project-scoped (no container_name / no shared net).
#
# Architecture: the `iii` engine runs the @agentmemory/agentmemory worker.
# State is file-based KV on the project-scoped `agentmemory-data` volume
# (/data) — NO Postgres/Redis needed. LLM + embeddings are routed through
# LiteLLM (see ./.env), so it shares the stack's key-rotation + spend logging.
#
# No published agentmemory image exists; built from the vendored Dockerfile
# (npm-installs the PUBLISHED, maintainer-tested @agentmemory/agentmemory
# release + copies the pinned iii engine binary from iiidev/iii). Bump
# AGENTMEMORY_VERSION for newer "stable" code. (_source/ is kept gitignored
# for reference only; the build does NOT use it.)
#
# Config split: ./.env  = NON-secret config (committed, env_file).
#               environment: = SECRETS only, from .stack/.env via
#               COMPOSE_ENV_FILES (OPENAI_API_KEY is a LiteLLM virtual key
#               scoped to glm/grok/voyage — never chatgpt/*, gotcha #5).
#
# REST API :3111 (health /agentmemory/livez), streams :3112. Not published;
# reachable on the project net as `agentmemory:3111` and from the Hermes VM
# at agentmemory.<project>.orb.local:3111.

services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.18"
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    profiles: [agentmemory]
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # From .stack/.env + .stack/*.generated.env (the single lever surface).
      # OPENAI_API_KEY = the unrestricted agentmemory LiteLLM virtual key.
      OPENAI_API_KEY: ${AGENTMEMORY_VIRTUAL_KEY}
      AGENTMEMORY_SECRET: ${AGENTMEMORY_SECRET}
      # Model levers (namespaced .stack/.env vars; default -> STACK_LLM_MODEL*).
      OPENAI_MODEL: ${AGENTMEMORY_MODEL}
      OPENAI_EMBEDDING_MODEL: ${AGENTMEMORY_EMBEDDING_MODEL}
      # Non-secret, but project-scoped (needs COMPOSE_PROJECT_NAME
      # interpolation, so it lives here not in the static .env). Lets the
      # viewer's Host-header allowlist accept the OrbStack DNS name so the
      # web UI is reachable at agentmemory.<project>.orb.local:3113.
      VIEWER_ALLOWED_HOSTS: agentmemory.${COMPOSE_PROJECT_NAME}.orb.local:3113
      # Admin-UI (viewer :3113) exposure toggle. Default 1 (on). To DISABLE
      # the unauthenticated admin web UI, set AGENTMEMORY_EXPOSE_VIEWER=0 in
      # .stack/.env (NOT here — this file is git-tracked). When 0 the
      # entrypoint skips the socat forwarder and the viewer stays
      # 127.0.0.1-only inside the container (unreachable via orb DNS).
      AGENTMEMORY_EXPOSE_VIEWER: ${AGENTMEMORY_EXPOSE_VIEWER}
    expose:
      - "3111"
      - "3112"
      - "3113"
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-data:
