# camofox-browser is standalone (no requires) — but it IS a source-class
# service with its own pinned _source. Bump via CAMOFOX_BROWSER_VERSION in
# .stack/.env.
runner: docker
desc: "Stealth headless browser API (Camoufox/Firefox; Hermes browser_provider)"
provides:
  api: { port: 9377 }
# main@2026-05-18 (resolve via git describe when _source is checked out)
source:
  repo: https://github.com/jo-inc/camofox-browser
  default: c9a90dafc76d2dfa0eb5d74fa36ef28f3ba98b29
env: |
  # Auth lever — "disabled" drops the bearer-key gate (required for Hermes,
  # which doesnt send Authorization headers; orb-DNS-only exposure is the
  # trust boundary in that mode). Default is to generate + require a key.
  CAMOFOX_AUTH=disabled
  CAMOFOX_MEM=2g
  CAMOFOX_CPU=2
  CAMOFOX_HEAP_MB=128
