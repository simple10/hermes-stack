# cliproxyapi (router-for-me/CLIProxyAPI) — wraps ChatGPT Codex / Gemini CLI /
# Claude Code / Grok OAuth subscriptions as an OpenAI/Gemini/Claude/Codex-
# compatible API. profile [cliproxyapi]. Project-scoped (no container_name /
# no shared net). STANDALONE — it is an ALTERNATIVE upstream proxy, NOT a
# LiteLLM consumer (no pg/redis/litellm deps, no virtual key).
#
# Intended use: a streaming-correct OpenAI/Codex (responses) proxy for the
# ChatGPT subscription, until LiteLLM fixes its non-streaming chatgpt/* bug
# (gotcha #5). Not yet wired into Hermes — that + the one-time provider OAuth
# login (via the management panel) are the documented follow-up.
#
# Published image PINNED to a release tag (gotcha #6); bump via CLIPROXY_VERSION
# in .stack/.env. Config is FILE-based (no env support) -> rendered by
# build.ts into the gitignored config.runtime.yaml with secrets injected.
# OAuth tokens persist in the project-scoped cliproxyapi-auth volume.
# API + management panel on :8317; reachable at
# cliproxyapi.<project>.orb.local:8317 (not host-published).

services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:${CLIPROXY_VERSION}
    profiles: [cliproxyapi]
    restart: unless-stopped
    # No host ports — orb-DNS only (stack convention). The OAuth callback
    # "failing" in the browser is EXPECTED: paste that URL into the panel's
    # callback field and the server completes it. See ./README.md for the
    # (unused) loopback-publish approach if zero-copy/paste is ever wanted.
    expose:
      - "8317"
    volumes:
      # config.yaml is RW + DASHBOARD-AUTHORITATIVE: the management panel writes
      # settings (file logging, plugins, providers) back to it. build.ts seeds
      # it once then never clobbers it (reset: rm the file + stack-cli build).
      - ../../.stack/cliproxyapi/config.runtime.yaml:/CLIProxyAPI/config.yaml
      # Persist file logs (logging-to-file) + plugins (plugins.dir: "plugins")
      # via bind mounts so they survive recreates — same .stack/<svc>/ pattern
      # as litellm/chatgpt + hermes mounts. Pre-created by build.ts.
      - ../../.stack/cliproxyapi/logs:/CLIProxyAPI/logs
      - ../../.stack/cliproxyapi/plugins:/CLIProxyAPI/plugins
      - cliproxyapi-auth:/root/.cli-proxy-api
    healthcheck:
      # Liveness = the server is LISTENing on 8317 (hex 207D, state 0A). The
      # published image is now a slim Debian base (dash + coreutils + grep) with
      # NO HTTP client — v7.1.69 dropped the alpine busybox wget the old probe
      # used, so a wget/curl probe exits 127 (command not found) even though
      # /healthz serves 200. This /proc check needs only grep, no networking
      # tools, and no `$` (compose interpolates `$`/`${}` in healthcheck args).
      # Note: port-listen, not HTTP 200 — see the stack-level out-of-band probe
      # for richer health (docs/specs/2026-06-12-stack-cli-update-design.md).
      test: ["CMD-SHELL", "grep -qE ':207D [0-9A-F]+:0000 0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cliproxyapi-auth:
