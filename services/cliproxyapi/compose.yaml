# cliproxyapi (router-for-me/CLIProxyAPI) — wraps ChatGPT Codex / Gemini CLI /
# Claude Code / Grok OAuth subscriptions as an OpenAI/Gemini/Claude/Codex-
# compatible API. profile [cliproxyapi]. Project-scoped (no container_name /
# no shared net). STANDALONE — it is an ALTERNATIVE upstream proxy, NOT a
# LiteLLM consumer (no pg/redis/litellm deps, no virtual key).
#
# Intended use: a streaming-correct OpenAI/Codex (responses) proxy for the
# ChatGPT subscription, until LiteLLM fixes its non-streaming chatgpt/* bug
# (gotcha #5). Not yet wired into Hermes — that + the one-time provider OAuth
# login (via the management panel) are the documented follow-up.
#
# Published image PINNED to a release tag (gotcha #6); bump via CLIPROXY_VERSION
# in .stack/.env. Config is FILE-based (no env support) -> rendered by
# build.sh into the gitignored config.runtime.yaml with secrets injected.
# OAuth tokens persist in the project-scoped cliproxyapi-auth volume.
# API + management panel on :8317; reachable at
# cliproxyapi.<project>.orb.local:8317 (not host-published).

services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:${CLIPROXY_VERSION:-v7.1.11}
    profiles: [cliproxyapi]
    restart: unless-stopped
    expose:
      - "8317"
    # CLIProxyAPI's OAuth callbacks are FIXED loopback URLs (the providers'
    # pre-registered redirect URIs — no config/env override). The browser is
    # hard-redirected to http://127.0.0.1:<provider-port> after auth, so that
    # port must reach the container on the Mac's loopback. These mirror
    # CLIProxyAPI's own docker-compose.yml port set, kept 127.0.0.1-ONLY
    # (never 0.0.0.0/LAN; still api-key + management-key gated). orb DNS
    # (cliproxyapi.<project>.orb.local:8317) keeps working for in-OrbStack
    # clients regardless. Only the port(s) for providers you actually
    # OAuth-login need to be live — uncomment as needed to keep the host
    # surface minimal.
    ports:
      # API + management panel + the /v0-management-based OAuth callbacks
      # (anthropic/google/codex/xai/antigravity). Host port configurable
      # (container always listens on 8317).
      - "127.0.0.1:${CLIPROXY_HOST_PORT:-8317}:8317"
      # ChatGPT/Codex OAuth callback. FIXED at 1455 — OpenAI's pre-registered
      # Codex redirect URI is http://localhost:1455/...; NOT configurable
      # (changing it breaks the OAuth flow). LIVE (the chatgpt/* replacement).
      - "127.0.0.1:1455:1455"
      # Gemini CLI (Google) OAuth callback — geminiAuth.DefaultCallbackPort:
      # - "127.0.0.1:8085:8085"
      # Antigravity OAuth callback — antigravity.CallbackPort:
      # - "127.0.0.1:51121:51121"
      # Other provider/flow/version OAuth callback ports upstream publishes
      # (xAI/Grok, Claude variants); uncomment if a login's callback uses one:
      # - "127.0.0.1:54545:54545"
      # - "127.0.0.1:11451:11451"
    volumes:
      - ./config.runtime.yaml:/CLIProxyAPI/config.yaml:ro
      - cliproxyapi-auth:/root/.cli-proxy-api
    healthcheck:
      # /healthz is the dedicated unauthenticated health route -> 200
      # {"status":"ok"} when up. busybox wget (alpine; no curl) exits 0 on
      # 200, non-zero only on connect failure -> correct liveness.
      test: ["CMD-SHELL", "wget -q -O /dev/null -T3 http://127.0.0.1:8317/healthz 2>/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cliproxyapi-auth:
