# cliproxyapi: standalone OAuth-subscription proxy (ChatGPT Codex / Gemini
# / Claude / Grok). NOT a LiteLLM consumer — its a sibling api_base that
# LiteLLMs cliproxy/* model_list entries point at.
runner: docker
desc: 'OAuth-subscription proxy (ChatGPT/Gemini/Claude/Grok via cliproxy/*)'
provides:
  api: { port: 8317 }
  dashboard: # admin SPA — paste the management key into the panel
    port: 8317
    path: /management.html
    auth: { key: '${CLIPROXY_MANAGEMENT_KEY}' }
# Out-of-band health probe (stack-authoritative; image-tooling-independent).
# /healthz is the dedicated unauthenticated route -> 200 {"status":"ok"}.
health:
  path: /healthz
  port: 8317
# Update policy (declarative). Active channel override lives in .stack/.env as
# CLIPROXYAPI_UPDATE_CHANNEL; absent => `default`.
update:
  channels:
    stable: '^v\d+\.\d+\.\d+$'
  default: stable
  sort: semver
env: |
  # Client key (LiteLLM cliproxy/* model_list entries authenticate with this).
  # Management key gates the management/OAuth-login web panel. Both gen-once via
  # `stack-cli setup`. These are STACK-OWNED keys in config.runtime.yaml —
  # build.ts force-syncs them on every build (rotating just needs a restart; no
  # manual config edit), so edit them HERE, not in the dashboard.
  CLIPROXY_API_KEY=
  CLIPROXY_MANAGEMENT_KEY=
  # Enable CLIProxyAPI's plugin system (plugins.enabled). The dashboard has no
  # toggle for it, so it's a stack-owned key synced into config.runtime.yaml.
  # plugins live in the ./plugins bind mount (.stack/cliproxyapi/plugins).
  CLIPROXY_PLUGINS_ENABLED=false
  # Pinned image tag — bump deliberately. (v7.1.71 is newest as of 2026-06-12.)
  CLIPROXY_VERSION=v7.1.70
