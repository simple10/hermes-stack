# firecrawl-api depends_on redis, rabbitmq, and litellm (cross-profile).
# Uses its own firecrawl-postgres, NOT shared pg.
runner: docker
desc: "Self-hosted web scraper API (api + playwright + dedicated pg + nuq queue)"
litellmKey: true
requires: [redis, rabbitmq, litellm]
provides:
  api: { port: 3002, service: firecrawl-api }
# SOURCE-BUILT from the firecrawl monorepo, driven by FIRECRAWL_VERSION (a git
# tag) in .stack/.env. Firecrawl publishes NO versioned images (GHCR has only
# :latest), so its canonical version IS the repo tag; building all three
# services (api / playwright / nuq-postgres) from one pinned _source keeps them
# version-COHERENT (the api<->playwright protocol + nuq queue schema are
# version-coupled) and surfaces upstream contract changes at build time instead
# of as silent runtime failures. compose.yaml `build:`s each from
# _source/apps/*. `update` tracks the GitHub release tags.
source:
  repo: https://github.com/firecrawl/firecrawl
  default: v3.0.0
env: |
  FIRECRAWL_MODEL=${STACK_LLM_MODEL}
  # Resource limits (lighter than upstreams 8G/4CPU + 4G/2CPU defaults).
  FIRECRAWL_API_MEM=4g
  FIRECRAWL_API_CPU=2
  FIRECRAWL_PLAYWRIGHT_MEM=2g
  FIRECRAWL_PLAYWRIGHT_CPU=2
