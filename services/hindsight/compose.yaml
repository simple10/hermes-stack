# hindsight (vectorize-io/hindsight) — OPTIONAL agent memory. profile
# [hindsight]. Project-scoped (no container_name / no shared net). Prebuilt
# all-in-one image PINNED by digest (gotcha #6) — mirrored in
# Digest resolved at build time from services/hindsight/images.env -> HINDSIGHT_IMAGE;
# bump via .stack/.env HINDSIGHT_VERSION (tag or sha256 digest).
#
# Reaches pg + litellm by sibling service name on the Compose default
# network. depends_on pg+litellm so COMPOSE_PROFILES=hindsight auto-pulls
# them (Honcho pattern). LLM + embeddings route through LiteLLM on the
# (unrestricted) HINDSIGHT_VIRTUAL_KEY; the actual models are the
# HINDSIGHT_MODEL / HINDSIGHT_EMBEDDING_MODEL levers in .stack/.env
# (default cliproxy/* + voyage). The hindsight DB role/db/`vector` ext is
# provisioned idempotently every start by the hindsight-provision one-shot
# (depends_on: pg healthy) — additive, no <project>_pg-data recreate needed.
#
# All-in-one image runs the API (:8888, health GET /health) + the
# Control-Plane Web UI (:9999). Not published to the host; reachable on the
# project net as hindsight:8888 and from the Hermes VM at
# hindsight.<project>.orb.local:8888 / :9999.

services:
  hindsight:
    image: "${HINDSIGHT_IMAGE:?run 'just build' to resolve HINDSIGHT_VERSION}"
    profiles: [hindsight]
    restart: unless-stopped
    expose:
      - "8888"
      - "9999"
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD}@pg:5432/hindsight
      # LLM: LiteLLM is OpenAI-compatible. provider=litellm feeds the bare
      # alias to the litellm SDK which can't resolve a provider for a custom
      # proxy alias ("LLM Provider NOT provided"); the documented path for an
      # OpenAI-compatible endpoint is provider=openai + LLM_BASE_URL (alias
      # passed through, LiteLLM resolves it).
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: http://litellm:4000
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_VIRTUAL_KEY}
      # Model lever (namespaced .stack/.env var; default -> STACK_LLM_MODEL).
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_MODEL}
      # Embeddings: the litellm provider does a raw POST to <base>/embeddings
      # and only sends Authorization if its OWN key is set. It reads
      # EMBEDDINGS_LITELLM_API_KEY, falling back to the shared
      # LITELLM_API_KEY — it does NOT read LLM_API_KEY. Without it LiteLLM
      # (key-enforced) returns 401 and startup aborts.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: litellm
      HINDSIGHT_API_EMBEDDINGS_LITELLM_MODEL: ${HINDSIGHT_EMBEDDING_MODEL}
      HINDSIGHT_API_LITELLM_API_BASE: http://litellm:4000
      HINDSIGHT_API_LITELLM_API_KEY: ${HINDSIGHT_VIRTUAL_KEY}
      # Reranker (HINDSIGHT_RERANKER lever: local|litellm|rrf). The litellm-*
      # vars are inert unless provider=litellm; with it, reranking runs via
      # LiteLLM (/v1/rerank -> Voyage) instead of the in-process ~600 MB Torch
      # cross-encoder, and shows up in SpendLogs. local = best quality;
      # rrf = no model/API/RAM, weakest.
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_RERANKER}
      HINDSIGHT_API_RERANKER_LITELLM_API_BASE: http://litellm:4000
      HINDSIGHT_API_RERANKER_LITELLM_API_KEY: ${HINDSIGHT_VIRTUAL_KEY}
      HINDSIGHT_API_RERANKER_LITELLM_MODEL: ${HINDSIGHT_RERANK_MODEL}
    depends_on:
      pg: { condition: service_healthy }
      litellm: { condition: service_healthy }
      hindsight-provision: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot DB provisioner (replaces hindsight's 00-init.sql lines + vector).
  hindsight-provision:
    image: "pgvector/pgvector:${PG_VERSION}"
    profiles: [hindsight]
    restart: "no"
    labels:
      com.stack.role: provisioner
    environment:
      PGPASSWORD: ${POSTGRES_SUPERPASS}
      SVC_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD}
    depends_on:
      pg: { condition: service_healthy }
    volumes:
      - ./provision.sql:/provision.sql:ro
    command:
      - sh
      - -c
      - 'for i in $$(seq 1 30); do psql -v ON_ERROR_STOP=1 -h pg -U postgres -d postgres -v pw="$$SVC_DB_PASSWORD" -f /provision.sql && exit 0; echo "pg not ready (attempt $$i/30), retrying"; sleep 2; done; echo "provision: pg unreachable after retries"; exit 1'
