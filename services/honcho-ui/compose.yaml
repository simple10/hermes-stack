# honcho-ui (offendingcommit/openconcho) — OPTIONAL web UI for Honcho.
# profile [honcho-ui]. Project-scoped (no container_name / no shared net).
# Built from PINNED source (services/honcho-ui/build.sh -> _source/, gotcha
# #6) via the local multi-stage Dockerfile; no published image upstream.
#
# Stateless static SPA: NO database, NO secrets, NO model/env levers.
# Connection config lives in the browser's localStorage (OpenConcho's
# designed flow). nginx ALSO reverse-proxies Honcho under /honcho/ on this
# same origin: Honcho hardcodes its CORS allowlist (no knob) so a direct
# cross-origin browser call is blocked — same-origin proxying sidesteps CORS
# entirely (see nginx.conf). The base URL is build-time patched to that
# same-origin path (HONCHO_BASE_URL arg, project-scoped) so the first-run
# form opens PRE-FILLED — the user only adds the token (if any) and clicks
# Save. The token is NEVER injected (it stays a manual in-app field).
#
# depends_on honcho-api so COMPOSE_PROFILES=honcho-ui auto-pulls Honcho's API
# (the Honcho pattern). Plain list = service_started only: the static server
# must not block on (or crash-loop with) honcho-api health — nginx resolves
# honcho-api lazily at request time. For the deriver/dream features also
# enable the `honcho` profile.
#
# nginx listens on :80; OrbStack fronts it with auto-HTTPS, so the canonical
# URL is https (no port):
#   https://honcho-ui.<project>.orb.local
# The first-run form is pre-filled with the same-origin Honcho proxy
#   https://honcho-ui.<project>.orb.local/honcho
# (same scheme as the page = no CORS / no mixed-content; Honcho runs
# USE_AUTH=false here, so the token can be left blank) — just click Save.

services:
  honcho-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin Honcho proxy over OrbStack's auto-HTTPS (see nginx.conf
        # — avoids Honcho's hardcoded CORS allowlist; https matches the page
        # OrbStack serves, so no mixed-content). Project-scoped so multi-stack
        # stays correct; default keeps a plain `docker compose build` working
        # outside `just`.
        HONCHO_BASE_URL: https://honcho-ui.${COMPOSE_PROJECT_NAME:-aitools}.orb.local/honcho
    profiles: [honcho-ui]
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - honcho-api
    healthcheck:
      # 127.0.0.1 (not localhost): BusyBox wget resolves localhost to ::1
      # first and nginx only listens on IPv4 :80 -> false "unhealthy".
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 6s
      start_period: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
