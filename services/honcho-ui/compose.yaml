# honcho-ui (offendingcommit/openconcho) — OPTIONAL web UI for Honcho.
# profile [honcho-ui]. Project-scoped (no container_name / no shared net).
# Built from PINNED source (services/honcho-ui/build.sh -> _source/, gotcha
# #6) via the local multi-stage Dockerfile; no published image upstream.
#
# Stateless static SPA: NO database, NO secrets, NO model/env levers.
# Connection config lives in the browser's localStorage (OpenConcho's
# designed flow). The base URL is build-time patched to this stack's
# honcho-api (HONCHO_BASE_URL arg, project-scoped) so the first-run form
# opens PRE-FILLED — the user only adds the token (if any) and clicks Save.
# The token is NEVER injected (it stays a manual in-app field).
#
# depends_on honcho-api so COMPOSE_PROFILES=honcho-ui auto-pulls Honcho's API
# (the Honcho pattern). Plain list = service_started only: the static server
# must not block on (or crash-loop with) honcho-api health — the browser
# connects to Honcho later, on demand. For the deriver/dream features also
# enable the `honcho` profile.
#
# nginx listens on :80, so from the host it's a clean URL with NO port:
#   http://honcho-ui.<project>.orb.local
# The first-run form is pre-filled with http://honcho-api.<project>.orb.local
# :8000 (Honcho runs USE_AUTH=false here, so the token can be left blank) —
# just click Save.

services:
  honcho-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Project-scoped so multi-stack stays correct; default keeps a plain
        # `docker compose build` working outside `just`.
        HONCHO_BASE_URL: http://honcho-api.${COMPOSE_PROJECT_NAME:-aitools}.orb.local:8000
    profiles: [honcho-ui]
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - honcho-api
    healthcheck:
      # 127.0.0.1 (not localhost): BusyBox wget resolves localhost to ::1
      # first and nginx only listens on IPv4 :80 -> false "unhealthy".
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 6s
      start_period: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
