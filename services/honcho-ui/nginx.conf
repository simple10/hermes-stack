# OpenConcho SPA + a same-origin reverse proxy to Honcho.
#
# Why the proxy: Honcho HARDCODES its CORS allowlist in src/main.py
# (localhost / 127.0.0.1:8000 / api.honcho.dev) with NO config or env knob,
# so a browser request from http://honcho-ui.<project>.orb.local fails the
# CORS preflight ("Disallowed CORS origin"). Serving Honcho under /honcho/
# on THIS origin means the browser never makes a cross-origin request — no
# CORS involved at all — and keeps honcho-ui decoupled from Honcho internals
# (survives Honcho pin bumps). The build-time default endpoint is set to
# this same-origin path (HONCHO_BASE_URL arg).
#
# TanStack Router is client-side, so non-asset paths fall back to index.html.

# Access log incl. the forwarded scheme (handy when checking the redirect).
log_format xfp '$remote_addr "$request" $status xfp=$http_x_forwarded_proto';

# Force HTTPS. OrbStack terminates TLS and proxies plain HTTP to :80; it sets
# X-Forwarded-Proto=https ONLY for https — plain http (and the in-container
# loopback healthcheck) send no XFP at all. So: redirect unless XFP is
# explicitly "https". $insecure = 1 means "needs redirect". The loopback
# healthcheck is exempted by using its own /healthz location (below), which
# carries no redirect guard.
map $http_x_forwarded_proto $insecure {
    default  1;
    "https"  0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log xfp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck target: never redirected (loopback has no XFP), scheme-
    # agnostic, cheap. Docker healthcheck hits http://127.0.0.1/healthz.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Honcho reverse proxy (same origin -> no CORS). Resolve honcho-api at
    # REQUEST time via Docker's embedded DNS so a honcho-api restart / new
    # IP doesn't need an nginx reload. The rewrite strips the /honcho/
    # prefix; proxy_buffering off + long read timeout keep Honcho's streamed
    # chat endpoint working. 308 over plain http preserves method/body.
    location /honcho/ {
        if ($insecure) { return 308 https://$host$request_uri; }
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $honcho_upstream honcho-api:8000;
        rewrite ^/honcho/(.*)$ /$1 break;
        proxy_pass http://$honcho_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 25m;
    }

    # OpenConcho v0.16+ talks to a SAME-ORIGIN /api prefix by default
    # (API_PREFIX; the default instance baseUrl is `${location.origin}/api`),
    # and the Honcho SDK appends /v3/<…>. Strip /api/ so honcho-api sees
    # /v3/<…>. Without this, /api/* falls through to the SPA handler and a
    # POST (e.g. workspaces/list) returns nginx 405. Same proxy settings as
    # /honcho/ (kept for instances saved against the older same-origin path).
    location /api/ {
        if ($insecure) { return 308 https://$host$request_uri; }
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $honcho_api_upstream honcho-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$honcho_api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 25m;
    }

    # Hashed build assets — safe to cache hard.
    location /assets/ {
        if ($insecure) { return 308 https://$host$request_uri; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        if ($insecure) { return 308 https://$host$request_uri; }
        try_files $uri $uri/ /index.html;
    }
}
