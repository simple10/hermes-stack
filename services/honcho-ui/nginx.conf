# Static serve for the OpenConcho SPA. TanStack Router is client-side, so any
# deep link must fall back to index.html. No backend/proxy here: the browser
# talks to Honcho directly at the URL entered in-app (CORS handled by Honcho).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
