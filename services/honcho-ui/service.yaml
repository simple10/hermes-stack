# honcho-ui depends_on honcho-api (cross-profile -> honcho). Static SPA;
# no model/runtime levers — all behavior comes from honcho-api.
runner: docker
desc: "OpenConcho web UI for Honcho (static SPA + same-origin proxy)"
requires: [honcho]
provides:
  # nginx listens :80; OrbStack fronts it with auto-HTTPS -> bare domain.
  ui: { port: 80 }
# Source-class. Bump via HONCHO_UI_VERSION in .stack/.env.
# v0.8.0-5-ge490d91 (main, 2026-05-15)
source:
  repo: https://github.com/offendingcommit/openconcho
  # Release tag (was commit e490d911, 125 commits behind v0.16.0) so `stack-cli
  # update` can track releases. NOTE: this is a sizable upgrade — test before
  # merging. stackSource resolves the ref -> commit SHA.
  default: v0.16.0
