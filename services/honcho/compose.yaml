# honcho api+deriver. profile [honcho]. Project-scoped (no container_name /
# no shared network). Reaches pg/redis/litellm by sibling service name.
# depends_on litellm so COMPOSE_PROFILES=honcho auto-pulls it.

services:
  honcho-api:
    build: { context: ./_source, dockerfile: Dockerfile }
    profiles: [honcho]
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD}@pg:5432/honcho
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      HONCHO_VIRTUAL_KEY: ${HONCHO_VIRTUAL_KEY}
      # The startup embedding-validator refuses to serve unless the physical
      # pgvector column dim == EMBEDDING_VECTOR_DIMENSIONS. alembic hardcodes
      # vector(1536); the honcho-schema one-shot (below) runs
      # configure_embeddings.py --yes which ALTERs the EMPTY columns to 1024
      # — this value must match so the validator passes. In-place resize of a
      # POPULATED column is intentionally out of scope (configure_embeddings
      # refuses it; needs an out-of-band re-embed migration).
      EMBEDDING_VECTOR_DIMENSIONS: "1024"
    volumes:
      - ../../.stack/honcho/config.runtime.toml:/app/config.toml:ro
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
      litellm: { condition: service_healthy }
      honcho-provision: { condition: service_completed_successfully }
      honcho-schema: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 30

  honcho-deriver:
    build: { context: ./_source, dockerfile: Dockerfile }
    profiles: [honcho]
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD}@pg:5432/honcho
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      HONCHO_VIRTUAL_KEY: ${HONCHO_VIRTUAL_KEY}
      # The startup embedding-validator refuses to serve unless the physical
      # pgvector column dim == EMBEDDING_VECTOR_DIMENSIONS. alembic hardcodes
      # vector(1536); the honcho-schema one-shot (below) runs
      # configure_embeddings.py --yes which ALTERs the EMPTY columns to 1024
      # — this value must match so the validator passes. In-place resize of a
      # POPULATED column is intentionally out of scope (configure_embeddings
      # refuses it; needs an out-of-band re-embed migration).
      EMBEDDING_VECTOR_DIMENSIONS: "1024"
    volumes:
      - ../../.stack/honcho/config.runtime.toml:/app/config.toml:ro
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
      honcho-api: { condition: service_healthy }
      honcho-provision: { condition: service_completed_successfully }
      honcho-schema: { condition: service_completed_successfully }

  # One-shot DB provisioner (replaces honcho's 00-init.sql lines + vector ext).
  honcho-provision:
    image: "pgvector/pgvector:${PG_VERSION}"
    profiles: [honcho]
    restart: "no"
    labels:
      com.stack.role: provisioner
    environment:
      PGPASSWORD: ${POSTGRES_SUPERPASS}
      SVC_DB_PASSWORD: ${HONCHO_DB_PASSWORD}
    depends_on:
      pg: { condition: service_healthy }
    volumes:
      - ./provision.sql:/provision.sql:ro
    command:
      - sh
      - -c
      - 'for i in $$(seq 1 30); do psql -v ON_ERROR_STOP=1 -h pg -U postgres -d postgres -v pw="$$SVC_DB_PASSWORD" -f /provision.sql && exit 0; echo "pg not ready (attempt $$i/30), retrying"; sleep 2; done; echo "provision: pg unreachable after retries"; exit 1'

  # One-shot schema/dim init (honcho image). Ordered AFTER honcho-provision
  # (role/db) and BEFORE honcho-api/deriver. Runs alembic (provision_db.py,
  # hardcoded vector(1536)) then configure_embeddings.py --yes which ALTERs
  # the EMPTY embedding columns to EMBEDDING_VECTOR_DIMENSIONS (1024). Safe:
  # configure_embeddings REFUSES to touch a POPULATED column and is a no-op
  # when the schema already matches → idempotent on every start, never
  # corrupts vectors (replaces the old unsafe post-start honcho-postup).
  honcho-schema:
    build: { context: ./_source, dockerfile: Dockerfile }
    profiles: [honcho]
    restart: "no"
    labels:
      com.stack.role: provisioner
    entrypoint: ["/bin/sh", "-c"]
    command:
      - '/app/.venv/bin/python scripts/provision_db.py && /app/.venv/bin/python scripts/configure_embeddings.py --yes'
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD}@pg:5432/honcho
      CACHE_ENABLED: "false"
      HONCHO_VIRTUAL_KEY: ${HONCHO_VIRTUAL_KEY}
      EMBEDDING_VECTOR_DIMENSIONS: "1024"
    volumes:
      - ../../.stack/honcho/config.runtime.toml:/app/config.toml:ro
    depends_on:
      pg: { condition: service_healthy }
      honcho-provision: { condition: service_completed_successfully }
