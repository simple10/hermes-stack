# honcho api+deriver. profile [honcho]. Project-scoped (no container_name /
# no shared network). Reaches pg/redis/litellm by sibling service name.
# depends_on litellm so COMPOSE_PROFILES=honcho auto-pulls it.

services:
  honcho-api:
    build: { context: ./_source, dockerfile: Dockerfile }
    profiles: [honcho]
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD}@pg:5432/honcho
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      HONCHO_VIRTUAL_KEY: ${HONCHO_VIRTUAL_KEY}
    volumes:
      - ./config.runtime.toml:/app/config.toml:ro
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
      litellm: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 30

  honcho-deriver:
    build: { context: ./_source, dockerfile: Dockerfile }
    profiles: [honcho]
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD}@pg:5432/honcho
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      HONCHO_VIRTUAL_KEY: ${HONCHO_VIRTUAL_KEY}
    volumes:
      - ./config.runtime.toml:/app/config.toml:ro
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
      honcho-api: { condition: service_healthy }
