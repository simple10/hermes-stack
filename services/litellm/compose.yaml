# litellm. profile [litellm]. Project-scoped (no container_name / no shared
# network). Reaches pg/redis by sibling service name on the Compose default
# network. Image PINNED by digest (gotcha #6) — mirrored in
# services/litellm/.image-digest; bump deliberately via commit (update both).

services:
  litellm:
    image: ghcr.io/berriai/litellm-database@sha256:7bb80500033392233c79f74d4f99d43512da47626cdc9bf46e53df16803d88cd
    profiles: [litellm]
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@pg:5432/litellm
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      # Auth for the cliproxy/* model_list entries -> http://cliproxyapi:8317
      # (CLIProxyAPI-routed ChatGPT/Codex; streaming-correct, observable).
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      REDIS_URL: redis://redis:6379
      # ChatGPT Subscription Proxy Config — see chatgpt/README.md.
      # CHATGPT_DEFAULT_INSTRUCTIONS must be >= a single space to stop LiteLLM
      # injecting the codex system prompt.
      CHATGPT_DEFAULT_INSTRUCTIONS: " "
      CHATGPT_TOKEN_DIR: /root/.codex/chatgpt
      CHATGPT_AUTH_FILE: auth.json
    volumes:
      - ./config.runtime.yaml:/app/config.yaml:ro
      - ./chatgpt:/root/.codex/chatgpt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 18
