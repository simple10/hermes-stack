# litellm. profile [litellm]. Project-scoped (no container_name / no shared
# network). Reaches pg/redis by sibling service name on the Compose default
# network. Image PINNED by digest (gotcha #6) — mirrored in
# Digest resolved at build time from services/litellm/images.env -> LITELLM_IMAGE;
# bump via .stack/.env LITELLM_VERSION (tag or sha256 digest).

services:
  litellm:
    image: "${LITELLM_IMAGE:?run 'just build' to resolve LITELLM_VERSION}"
    profiles: [litellm]
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@pg:5432/litellm
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      # Auth for the cliproxy/* model_list entries -> http://cliproxyapi:8317
      # (CLIProxyAPI-routed ChatGPT/Codex; streaming-correct, observable).
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      REDIS_URL: redis://redis:6379
      # ChatGPT Subscription Proxy Config — see chatgpt/README.md.
      # CHATGPT_DEFAULT_INSTRUCTIONS must be >= a single space to stop LiteLLM
      # injecting the codex system prompt.
      CHATGPT_DEFAULT_INSTRUCTIONS: " "
      CHATGPT_TOKEN_DIR: /root/.codex/chatgpt
      CHATGPT_AUTH_FILE: auth.json
    volumes:
      - ../../.stack/litellm/config.runtime.yaml:/app/config.yaml:ro
      - ../../.stack/litellm/chatgpt:/root/.codex/chatgpt
    depends_on:
      litellm-provision: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 18

  # One-shot DB provisioner (replaces this service's 00-init.sql lines).
  # sh -c so the CONTAINER expands $SVC_DB_PASSWORD (compose-interpolated in
  # the environment: map); a bare command would pass psql the literal token.
  litellm-provision:
    image: "pgvector/pgvector:${PG_VERSION}"
    profiles: [litellm]
    restart: "no"
    labels:
      com.stack.role: provisioner
    environment:
      PGPASSWORD: ${POSTGRES_SUPERPASS}
      SVC_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
    depends_on:
      pg: { condition: service_healthy }
    volumes:
      - ./provision.sql:/provision.sql:ro
    command:
      - sh
      - -c
      - 'for i in $$(seq 1 30); do psql -v ON_ERROR_STOP=1 -h pg -U postgres -d postgres -v pw="$$SVC_DB_PASSWORD" -f /provision.sql && exit 0; echo "pg not ready (attempt $$i/30), retrying"; sleep 2; done; echo "provision: pg unreachable after retries"; exit 1'
