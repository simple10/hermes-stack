# pnpm 11+ reads workspace-level pnpm settings from this file instead of
# `pnpm.*` blocks in package.json.

overrides:
  # wrangler is installed globally (cloudflare-project-conventions memory),
  # but @cloudflare/vitest-pool-workers declares it as a peer. Pin the
  # transitive resolution so the peer is satisfied without adding wrangler
  # as a direct dep.
  wrangler: '^4.93.0'
  # drizzle-kit pulls esbuild@0.25.x; pin to 0.28+ so the @esbuild/* native
  # binaries are past pmg's freshness cooldown.
  esbuild: '^0.28.0'

# Don't auto-install peer dependencies. Keeps the install surface to exactly
# what's in package.json — every dep is an explicit choice. If a package
# legitimately needs a peer we currently miss, add it to package.json deps.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
