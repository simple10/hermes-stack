overrides:
  wrangler: '^4.93.0'

# Don't auto-install peer dependencies. Keeps the install surface to exactly
# what's in package.json5 — every dep is an explicit choice.
#
# In particular this skips @better-auth/passkey (declared as a non-optional
# peer of @better-auth-ui/react), which would otherwise pull in
# @simplewebauthn/server → @peculiar/x509 — a transitive that gets blocked
# by pmg's freshness cooldown and that we don't use.
#
# If a package legitimately needs a peer we currently miss, add it to
# package.json5 dependencies directly.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  msw: true
  sharp: false
  unrs-resolver: true
  workerd: true
