# postgres (pgvector). profile [pg] — pulled in via SERVICE_REQUIRES=pg.
# No container_name / no shared network: services are project-scoped, so
# multiple stacks coexist. Sibling services reach this at host `pg` on the
# Compose default network; Hermes reaches it at pg.<project>.orb.local.
# Volume is project-scoped (default <project>_pg-data) — recreate-from-scratch
# is fine (no data of value yet).

services:
  pg:
    image: "pgvector/pgvector:${PG_VERSION}"
    profiles: [pg]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    # No entrypoint wrapper / 00-init.sql seeding: each pg-using service owns
    # its role/db/extension via its own one-shot provisioner (depends_on pg
    # healthy). max_connections kept via the default-entrypoint command.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pg-data:/var/lib/postgresql/data/
    # The image's VOLUME is the PARENT /var/lib/postgresql; we only mount the
    # /data subpath (pg-data), so the parent would get a NEW anonymous volume
    # on every container (re)create. tmpfs the parent — the real DB lives in
    # the named pg-data mount nested under it, so no dangling volumes pile up.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
