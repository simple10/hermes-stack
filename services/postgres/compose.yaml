# postgres (pgvector). No profile => always-on shared backend.
# No container_name / no shared network: services are project-scoped, so
# multiple stacks coexist. Sibling services reach this at host `pg` on the
# Compose default network; Hermes reaches it at pg.<project>.orb.local.
# Volume is project-scoped (default <project>_pg-data) — recreate-from-scratch
# is fine (no data of value yet).

services:
  pg:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    # No entrypoint wrapper / 00-init.sql seeding: each pg-using service owns
    # its role/db/extension via its own one-shot provisioner (depends_on pg
    # healthy). max_connections kept via the default-entrypoint command.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pg-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
