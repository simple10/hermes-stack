# postgres (pgvector). No profile => always-on shared backend.
# No container_name / no shared network: services are project-scoped, so
# multiple stacks coexist. Sibling services reach this at host `pg` on the
# Compose default network; Hermes reaches it at pg.<project>.orb.local.
# Volume is project-scoped (default <project>_pg-data) — recreate-from-scratch
# is fine (no data of value yet).

services:
  pg:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      HONCHO_PW: ${HONCHO_DB_PASSWORD}
      LITELLM_PW: ${LITELLM_DB_PASSWORD}
      HINDSIGHT_PW: ${HINDSIGHT_DB_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        sed -e "s/:HONCHO_PW/$${HONCHO_PW}/" -e "s/:LITELLM_PW/$${LITELLM_PW}/" \
          -e "s/:HINDSIGHT_PW/$${HINDSIGHT_PW}/" \
          /seed/00-init.sql > /docker-entrypoint-initdb.d/00-init.sql && \
        exec docker-entrypoint.sh postgres -c max_connections=200
    volumes:
      - pg-data:/var/lib/postgresql/data/
      - ./pg-init/00-init.sql:/seed/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
