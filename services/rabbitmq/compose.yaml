# rabbitmq. profile [rabbitmq] — pulled in via SERVICE_REQUIRES=rabbitmq (nuq
# notify/prefetch transport); it is NOT shared substrate, so it must not run
# when firecrawl is off. No backends-line entry: it comes up (and is waited
# on, healthy) via firecrawl-api's `depends_on: rabbitmq` inside `dc up -d`
# when the firecrawl profile is active. If a future service genuinely needs
# AMQP, widen this profile list then (don't pre-generalize — YAGNI).
# Project-scoped (no container_name / no shared network). Siblings reach it
# at host `rabbitmq:5672`; mgmt UI
# at rabbitmq.<project>.orb.local:15672 (default guest/guest — localhost-only
# by RabbitMQ default, so orb-DNS is effectively read-blocked; the AMQP path
# on the project net is unauthenticated, same as upstream firecrawl). Tag-
# pinned like redis:8.6.3 (backends use tag pins, not digests).
services:
  rabbitmq:
    image: rabbitmq:4.3.0-management
    profiles: [rabbitmq]
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # timings intentionally more generous than the redis/pg backend
      # precedent (5s/5s/10, no start_period) — RabbitMQ's epmd/beam boot is
      # genuinely slower (~10-20s). Do NOT "normalize" back to 5s/3 retries
      # (causes flaky firecrawl-api `depends_on: rabbitmq service_healthy`).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rabbitmq-data:
