# redis. profile [redis] — pulled in via SERVICE_REQUIRES=redis. Project-scoped (no
# container_name / no shared network). Siblings reach it at host `redis`.

services:
  redis:
    image: "redis:${REDIS_VERSION:-8.6.3}"
    profiles: [redis]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
