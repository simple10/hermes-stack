# searxng — privacy-respecting metasearch (70+ engines). Profile [searxng]
# (opt-in). STANDALONE: no pg/redis/litellm/rabbitmq dependency. Hermes uses
# it for web search via Hermes' web.search_backend=searxng + SEARXNG_URL env
# (wired by services/hermes/build.ts when this profile is active). Project-
# scoped: no container_name / no shared network; siblings reach as `searxng`,
# Hermes VM reaches as searxng.<project>.orb.local:8080. No host port exposed
# — orb DNS is the trust boundary.
# Image is tag-class (drift accepted; bump SEARXNG_VERSION in .stack/.env).
# Default tag pinned to a recent release; date-formatted tags are immutable.
services:
  searxng:
    image: "docker.io/searxng/searxng:${SEARXNG_VERSION}"
    profiles: [searxng]
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Default base URL for self-references in HTML; harmless for JSON-only
      # use, but searxng warns at boot without it. Project-scoped orb DNS.
      SEARXNG_BASE_URL: "http://searxng.${COMPOSE_PROJECT_NAME}.orb.local:8080/"
      # Built-in env override for the secret_key (also templated into our
      # settings.yml — searxng accepts both; env wins). Keeps the secret out
      # of the on-disk settings.yml at runtime if someone reads it.
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY}
    volumes:
      # Our overlay (generated by services/searxng/build.ts from settings.yml
      # .template). use_default_settings: true inside it inherits the image's
      # /etc/searxng/settings.yml; we only override formats (add json), the
      # secret_key, and rate-limiter (off; no public exposure).
      - ../../.stack/searxng/settings.yml:/etc/searxng/settings.yml:ro
    # The image declares VOLUME /var/cache/searxng — pure ephemeral cache, so
    # map it to tmpfs to avoid leaking an anonymous volume per recreate.
    # (/etc/searxng is also a VOLUME but holds bound config; left as-is since
    # this service is recreate-only/rare.)
    tmpfs:
      - /var/cache/searxng
    healthcheck:
      # /healthz on searxng returns 200 OK with no body when up.
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 --timeout=3 http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    cpus: ${SEARXNG_CPU:-1}
    mem_limit: ${SEARXNG_MEM:-512m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
